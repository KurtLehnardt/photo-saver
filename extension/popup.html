<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #1a1a1a;
      color: #fff;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 4px 0;
      font-weight: 700;
    }
    .subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 16px;
    }
    .status {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 16px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
    }
    .status.error {
      color: #ff6b6b;
      background: rgba(255,100,100,0.1);
    }
    .status.ok {
      color: #34c759;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    #btn-start {
      background: #34c759;
      color: #fff;
    }
    #btn-start:hover { background: #2db84e; }
    #btn-start:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #btn-stop {
      background: rgba(255,100,100,0.2);
      color: #ff6b6b;
      display: none;
    }
    #btn-stop:hover { background: rgba(255,100,100,0.3); }
    .settings {
      margin-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 12px;
    }
    .setting {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 13px;
    }
    .setting select, .setting input[type="range"] {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
    }
    .setting input[type="checkbox"] {
      width: 36px;
      height: 20px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
    }
    .setting input[type="checkbox"]:checked { background: #34c759; }
    .setting input[type="checkbox"]::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .setting input[type="checkbox"]:checked::after { transform: translateX(16px); }
    .range-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .range-wrap input[type="range"] {
      width: 80px;
      -webkit-appearance: none;
      height: 3px;
      border: none;
    }
    .range-val {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      min-width: 24px;
      text-align: right;
    }
  </style>
</head>
<body>
  <h1>FrameFlow</h1>
  <div class="subtitle">iCloud Photos Slideshow</div>

  <div id="status" class="status">Checking page...</div>

  <div class="setting" style="margin-bottom:8px">
    <span>Photos to load</span>
    <select id="set-photo-count">
      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100" selected>100</option>
      <option value="250">250</option>
      <option value="500">500</option>
      <option value="1000">1000</option>
      <option value="0">All (slow)</option>
    </select>
  </div>
  <div class="setting" style="margin-bottom:12px">
    <span>Hi-Res Mode</span>
    <input type="checkbox" id="set-hires">
  </div>
  <div id="hires-note" style="font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:12px;display:none">
    Clicks through each photo for full resolution. Slower but much better quality.
  </div>

  <button id="btn-start">Start Slideshow</button>
  <button id="btn-stop">Stop Slideshow</button>

  <div class="settings">
    <div class="setting">
      <span>Photo Fill</span>
      <select id="set-fill">
        <option value="contain">Fit</option>
        <option value="cover">Fill</option>
      </select>
    </div>
    <div class="setting">
      <span>Shuffle</span>
      <input type="checkbox" id="set-shuffle" checked>
    </div>
    <div class="setting">
      <span>Transition</span>
      <select id="set-transition">
        <option value="fade">Fade</option>
        <option value="slide">Slide</option>
        <option value="none">None</option>
      </select>
    </div>
    <div class="setting">
      <span>Ken Burns</span>
      <input type="checkbox" id="set-kenburns" checked>
    </div>
    <div class="setting">
      <span>Duration</span>
      <div class="range-wrap">
        <input type="range" id="set-duration" min="3" max="30" value="8">
        <span class="range-val" id="duration-val">8s</span>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
